name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Frontend: TypeScript check, ESLint, build
  # ===========================================================================
  frontend-check:
    name: Frontend (TypeScript + ESLint + Build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src/ --max-warnings=0

      - name: Build
        run: npm run build
        env:
          # Provide placeholder values so Next.js build succeeds without real APIs
          NEXT_PUBLIC_API_URL: http://localhost:8000
          INTERNAL_API_URL: http://localhost:8000

  # ===========================================================================
  # Backend: ruff lint, mypy type check, pytest
  # ===========================================================================
  backend-check:
    name: Backend (Ruff + Mypy + Pytest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install uv
        run: pip install uv==0.5.14

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Ruff lint
        run: ruff check app/ tests/

      - name: Ruff format check
        run: ruff format --check app/ tests/

      - name: Mypy type check
        run: mypy app/

      - name: Pytest
        run: pytest tests/ -v --tb=short
        env:
          # Use mock provider in CI — no real API calls
          AI_PROVIDER: anthropic
          ANTHROPIC_API_KEY: sk-ant-ci-placeholder
          CHROMA_HOST: localhost
          CHROMA_PORT: 8001
          DATABASE_URL: postgresql://ukready:test@localhost:5432/ukready
          ENVIRONMENT: development

  # ===========================================================================
  # Terraform: fmt check + validate
  # ===========================================================================
  terraform-validate:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infrastructure/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate
